name: AI News Scout 24/7

on:
  schedule:
    # Runs every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AI News Scout
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'ai-news-scout-alert-94b2f1' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scout.py run

      - name: Commit & Persist Deduplication Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add cache/seen_items.json
            if git diff --staged --quiet; then
              echo "No cache updates to commit."
              break
            fi
            if git commit -m "🤖 Scout: update seen cache [skip ci]" && git push origin main; then
              echo "Successfully persisted cache."
              break
            fi
            sleep 2
          done
